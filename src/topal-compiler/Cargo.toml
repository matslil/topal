[package]
name = "topal-compiler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
object = { version = "0.40", default-features = false, features = ["elf", "read_core", "std", "write_core"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.10"
topal-geir = { path = "../topal-geir" }
topal-c-abi = { path = "../topal-c-abi" }
topal-language = { path = "../topal-language" }
topal-semantics = { path = "../topal-semantics" }
topal-source = { path = "../topal-source" }

[lints]
workspace = true

[[bin]]
name = "topalc"
path = "src/main.rs"
