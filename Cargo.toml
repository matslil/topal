[workspace]
members = [
    "src/topal-interpreter",
    "src/topal-language",
    "src/topal-lsp",
    "src/topal-source",
    "src/topal-syntax",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
