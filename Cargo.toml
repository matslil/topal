[workspace]
members = [
    "linux-kernel/tools/toolchain-gate-builder",
    "src/topal-best-practices",
    "src/topal-build",
    "src/topal-c-abi",
    "src/topal-c-bindgen",
    "src/topal-compiler",
    "src/topal-interpreter",
    "src/topal-debugger",
    "src/topal-doc",
    "src/topal-geir",
    "src/topal-language",
    "src/topal-linter",
    "src/topal-lsp",
    "src/topal-semantics",
    "src/topal-source",
    "src/topal-serialization",
    "src/topal-syntax",
    "src/topal-transfer",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Unlicense"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
